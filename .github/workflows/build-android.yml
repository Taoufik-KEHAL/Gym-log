name: Build Android APK (Lite)

on:
  push:
    branches:
      - main
    paths:
      - "www/**"
      - "android/**"
      - "capacitor.config.json"
      - "package.json"
      - ".github/workflows/build-android.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-log-lite-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s+"\K[^"]+' android/app/build.gradle)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk "Gym-Log-Lite-v${{ steps.version.outputs.name }}-debug.apk"

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-lite-latest
          name: Gym Log Lite Android v${{ steps.version.outputs.name }} (latest)
          body: |
            Auto-built debug APK from commit ${{ github.sha }}.
            This is the separate "Lite" app (com.taoufikkehal.gymlog.lite) -- installs side-by-side with the full Gym Log app.
            Download `Gym-Log-Lite-v${{ steps.version.outputs.name }}-debug.apk` below and open it on your phone to install (allow "install from this source" if prompted).
          make_latest: false
          files: Gym-Log-Lite-v${{ steps.version.outputs.name }}-debug.apk
