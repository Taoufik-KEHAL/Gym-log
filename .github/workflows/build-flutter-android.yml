name: Build Flutter Android APK

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/build-flutter-android.yml"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to publish the release under"
        required: false
        default: "flutter-android-latest"
      release_name:
        description: "Release title (leave blank to auto-generate from the app version)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.5"

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: gym-log-flutter-debug-apk
          path: mobile/build/app/outputs/flutter-apk/app-debug.apk

      - name: Read app version
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Rename APK with version
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk "../Gym-Log-Flutter-v${{ steps.version.outputs.name }}-debug.apk"

      - name: Resolve release tag/name
        id: release
        run: |
          TAG="${{ github.event.inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="flutter-android-latest"; fi
          NAME="${{ github.event.inputs.release_name }}"
          if [ -z "$NAME" ]; then NAME="Gym Log Flutter Android v${{ steps.version.outputs.name }} (latest)"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to a GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ${{ steps.release.outputs.name }}
          body: |
            Auto-built debug APK of the Flutter rewrite from commit ${{ github.sha }}.
            Download `Gym-Log-Flutter-v${{ steps.version.outputs.name }}-debug.apk` below and open it on your phone to install (allow "install from this source" if prompted).
          make_latest: false
          files: Gym-Log-Flutter-v${{ steps.version.outputs.name }}-debug.apk
