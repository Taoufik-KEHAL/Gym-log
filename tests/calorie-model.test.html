<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Calorie model v2 -- unit tests</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; background: #0f1115; color: #f2f3f5; }
  h1 { font-size: 1.3rem; }
  #summary { font-weight: 600; margin: 12px 0; }
  .case { padding: 8px 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.9rem; }
  .pass { background: rgba(94, 194, 160, 0.12); color: #5ec2a0; }
  .fail { background: rgba(224, 100, 90, 0.12); color: #e0645a; }
  .case code { opacity: 0.8; }
</style>
</head>
<body>
<h1>Calorie model v2 -- unit tests</h1>
<p>Loads <code>www/js/app.js</code> directly (same code the app runs) and exercises the pure
functions exposed via <code>window.__gymLogTestHooks</code>. Open this file in a browser to run.</p>
<div id="summary">Running…</div>
<div id="results"></div>

<!-- Loads the real app code under test; window.__gymLogTestHooks is set synchronously at
     parse time (before DOMContentLoaded), so it's ready as soon as this script tag loads.
     app.js's own init() will fire later on DOMContentLoaded and throw trying to find this
     page's (nonexistent) app elements -- harmless and unrelated to the tests below, which
     have already run by then. -->
<script src="../www/js/app.js"></script>
<script>
(function () {
  "use strict";
  var hooks = window.__gymLogTestHooks;
  var results = [];

  function approx(a, b, tolerance) {
    return Math.abs(a - b) <= tolerance;
  }

  function test(name, fn) {
    try {
      fn();
      results.push({ name: name, pass: true });
    } catch (e) {
      results.push({ name: name, pass: false, error: e.message });
    }
  }

  function assert(cond, message) {
    if (!cond) throw new Error(message || "assertion failed");
  }

  function clearStorage() {
    localStorage.removeItem("gymlog.settings");
    localStorage.removeItem("gymlog.daily");
  }

  // ---------- computeBMRForWeight ----------

  test("computeBMRForWeight: male, Mifflin-St Jeor", function () {
    clearStorage();
    hooks.saveSettings({ age: 30, heightCm: 180, sex: "male" });
    var bmr = hooks.computeBMRForWeight(80);
    // 10*80 + 6.25*180 - 5*30 + 5 = 1780
    assert(bmr === 1780, "expected 1780, got " + bmr);
  });

  test("computeBMRForWeight: female, Mifflin-St Jeor", function () {
    clearStorage();
    hooks.saveSettings({ age: 30, heightCm: 165, sex: "female" });
    var bmr = hooks.computeBMRForWeight(60);
    // 10*60 + 6.25*165 - 5*30 - 161 = 1320.25 -> rounds to nearest 10 -> 1320
    assert(bmr === 1320, "expected 1320, got " + bmr);
  });

  test("computeBMRForWeight: null without a profile (age/height missing)", function () {
    clearStorage();
    hooks.saveSettings({});
    assert(hooks.computeBMRForWeight(80) === null, "expected null with no profile set");
  });

  // ---------- net burn: workouts ----------

  test("estimateExerciseCalories: strength net = gross - resting burn", function () {
    var ex = { type: "strength", sets: [{ reps: 8, weight: 20 }, { reps: 8, weight: 20 }, { reps: 8, weight: 20 }, { reps: 8, weight: 20 }] };
    var weightKg = 80, bmr = 1780;
    // gross = 4 sets * 6.0 MET * 80kg / 60 = 32
    // minutes = 4 * 1.5 = 6; resting = 1780/1440*6 = 7.4167
    var net = hooks.estimateExerciseCalories(ex, weightKg, bmr);
    assert(approx(net, 32 - (1780 / 1440) * 6, 0.01), "expected ~24.58, got " + net);
    assert(net < 32, "net burn should be less than gross burn");
  });

  test("estimateExerciseCalories: cardio net = gross - resting burn", function () {
    var ex = { type: "cardio", name: "Cycling", duration: 30, pace: null };
    var weightKg = 80, bmr = 1780;
    // gross = 7.5 MET * 80kg * 0.5h = 300; minutes = 30; resting = 1780/1440*30 = 37.08
    var net = hooks.estimateExerciseCalories(ex, weightKg, bmr);
    assert(approx(net, 300 - (1780 / 1440) * 30, 0.01), "expected ~262.9, got " + net);
  });

  test("estimateExerciseCalories: falls back to gross when bmr is unavailable", function () {
    var ex = { type: "strength", sets: [{ reps: 8, weight: 20 }] };
    var net = hooks.estimateExerciseCalories(ex, 80, null);
    assert(net === 8, "expected gross-equal 8 (1 set * 6.0 MET * 80 / 60), got " + net);
  });

  test("estimateExerciseCalories: never negative (floored at 0)", function () {
    var ex = { type: "strength", sets: [{ reps: 8, weight: 10 }] };
    // Deliberately absurd bmr so resting burn swamps the tiny gross estimate --
    // this is a pure arithmetic floor check, not a realistic physiological case.
    var net = hooks.estimateExerciseCalories(ex, 40, 100000);
    assert(net === 0, "expected 0, got " + net);
  });

  // ---------- net burn: steps ----------

  test("estimateStepsCalories: net = gross - resting burn", function () {
    var steps = 8000, weightKg = 80, bmr = 1780;
    // gross = 8000 * 80 * 0.0005 = 320; minutes = 8000/100 = 80; resting = 1780/1440*80 = 98.9
    var net = hooks.estimateStepsCalories(steps, weightKg, bmr);
    assert(approx(net, 320 - (1780 / 1440) * 80, 0.01), "expected ~221.1, got " + net);
  });

  test("estimateStepsCalories: 0 steps -> 0, never negative", function () {
    assert(hooks.estimateStepsCalories(0, 80, 1780) === 0, "expected 0 for 0 steps");
    assert(hooks.estimateStepsCalories(50, 80, 100000) === 0, "expected floor at 0 for absurd bmr");
  });

  // ---------- TEF ----------

  test("computeTEF: 10% of intake", function () {
    assert(hooks.computeTEF(2430) === 243, "expected 243, got " + hooks.computeTEF(2430));
  });

  test("computeTEF: 0 when nothing logged", function () {
    assert(hooks.computeTEF(null) === 0, "expected 0 for null intake");
    assert(hooks.computeTEF(0) === 0, "expected 0 for 0 intake");
  });

  // ---------- maintenance band thresholds ----------

  test("classifyMaintenanceBand: within +-150 -> At maintenance", function () {
    assert(hooks.classifyMaintenanceBand(0).label === "At maintenance");
    assert(hooks.classifyMaintenanceBand(150).label === "At maintenance", "150 should be inclusive");
    assert(hooks.classifyMaintenanceBand(-150).label === "At maintenance", "-150 should be inclusive");
  });

  test("classifyMaintenanceBand: beyond 150 under -> In deficit", function () {
    assert(hooks.classifyMaintenanceBand(151).label === "In deficit");
  });

  test("classifyMaintenanceBand: beyond 150 over -> Over maintenance", function () {
    assert(hooks.classifyMaintenanceBand(-151).label === "Over maintenance");
  });

  // ---------- adaptive TDEE ----------

  test("adaptiveTDEE formula: given avgIntake 2430, trend 107.3 -> 106.9kg, 28 days ~= 2540", function () {
    // Direct check of the formula/constant the task specifies, independent of how
    // adaptiveTDEE's own EMA/interpolation derives trendStart/trendEnd from raw logs
    // (covered separately by the integration case below).
    var avgIntake = 2430, trendStart = 107.3, trendEnd = 106.9, days = 28;
    var tdee = avgIntake + (trendStart - trendEnd) * 7700 / days;
    assert(approx(tdee, 2540, 1), "expected ~2540, got " + tdee);
  });

  test("adaptiveTDEE: integration case, 28 days of logs declining ~107.3 -> 106.9kg at 2430 kcal/day", function () {
    clearStorage();
    var daily = {};
    var endDate = "2026-09-28";
    var startWeight = 107.3, endWeight = 106.9;
    for (var i = 0; i < 28; i++) {
      var d = new Date(endDate + "T00:00:00");
      d.setDate(d.getDate() - (27 - i));
      var iso = d.toISOString().slice(0, 10);
      var entry = { calories: 2430 };
      // Skip a few scattered weigh-ins so the interpolation path is exercised too,
      // while staying well above the >=21-days-with-both validity threshold.
      if (i % 6 !== 3) {
        entry.weight = Math.round((startWeight + (endWeight - startWeight) * (i / 27)) * 10) / 10;
      }
      daily[iso] = entry;
    }
    hooks.saveDaily(daily);
    var tdee = hooks.adaptiveTDEE(endDate, 28);
    assert(tdee != null, "expected a numeric result, got null (check validity gate)");
    // Weight is declining while eating 2430/day, so true TDEE must read higher than
    // that -- generous band around the ~2540 figure from the task, not an exact match,
    // since the realistic EMA-smoothed path doesn't reproduce 107.3/106.9 as literal
    // endpoints (see the formula-level case above for that exact check).
    assert(tdee > 2430, "expected TDEE above avgIntake for a weight-losing window, got " + tdee);
    assert(approx(tdee, 2540, 120), "expected roughly ~2540 (+-120), got " + tdee);
  });

  test("adaptiveTDEE: null when fewer than 21 days have both intake and weight logged", function () {
    clearStorage();
    var daily = {};
    var endDate = "2026-09-28";
    for (var i = 0; i < 28; i++) {
      var d = new Date(endDate + "T00:00:00");
      d.setDate(d.getDate() - (27 - i));
      var iso = d.toISOString().slice(0, 10);
      // Only 10 of the 28 days get both fields logged -- below the 21-day threshold.
      daily[iso] = i < 10 ? { calories: 2400, weight: 90 } : {};
    }
    hooks.saveDaily(daily);
    assert(hooks.adaptiveTDEE(endDate, 28) === null, "expected null below the validity threshold");
  });

  test("adaptiveTDEE: null with no logged weight at all", function () {
    clearStorage();
    hooks.saveDaily({ "2026-09-28": { calories: 2400 } });
    assert(hooks.adaptiveTDEE("2026-09-28", 28) === null, "expected null with zero weigh-ins");
  });

  clearStorage();

  // ---------- render ----------

  var passCount = results.filter(function (r) { return r.pass; }).length;
  var summary = document.getElementById("summary");
  summary.textContent = passCount + " / " + results.length + " passed";
  summary.style.color = passCount === results.length ? "#5ec2a0" : "#e0645a";

  var container = document.getElementById("results");
  results.forEach(function (r) {
    var div = document.createElement("div");
    div.className = "case " + (r.pass ? "pass" : "fail");
    div.innerHTML = (r.pass ? "PASS -- " : "FAIL -- ") + r.name + (r.error ? " <code>(" + r.error + ")</code>" : "");
    container.appendChild(div);
  });
})();
</script>
</body>
</html>
